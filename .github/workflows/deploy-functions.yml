name: Deploy Edge Functions

# Edge Functions cannot be published by the Pages workflow (they need the Supabase
# Management API). Turn this on once SUPABASE_ACCESS_TOKEN is a repo secret and the
# repository variable SUPABASE_DEPLOY is set to "on":
#   gh variable set SUPABASE_DEPLOY --body on
# Until then deploys go through `npm run functions:deploy` from the dev machine.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SUPABASE_DEPLOY == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy deepseek-chat
        run: supabase functions deploy deepseek-chat --no-verify-jwt --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ secrets.TOOLS_SUPABASE_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
