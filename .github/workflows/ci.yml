name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: npm run check:generated
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test

  # Live checks run only on main, and only when the repo variable is switched on
  # (Settings → Secrets and variables → Actions → Repository variables):
  #   LIVE_TESTS=on      → supabase/migrations against the real project + PostgREST e2e
  #   BROWSER_TESTS=on   → Playwright smoke test of the built app
  live:
    if: github.event_name == 'push' && vars.LIVE_TESTS == 'on'
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations (idempotent)
        run: node scripts/db-push.mjs
        env:
          TOOLS_SUPABASE_URL: ${{ secrets.TOOLS_SUPABASE_URL }}
          TOOLS_SUPABASE_DB_PASSWORD: ${{ secrets.TOOLS_SUPABASE_DB_PASSWORD }}
          TOOLS_SUPABASE_REF: ${{ secrets.TOOLS_SUPABASE_REF }}
          TOOLS_DB_URL: ${{ secrets.TOOLS_DB_URL }}
      - name: Backend end-to-end
        run: node scripts/db-test.mjs
        env:
          TOOLS_SUPABASE_URL: ${{ secrets.TOOLS_SUPABASE_URL }}
          TOOLS_SUPABASE_ANON_KEY: ${{ secrets.TOOLS_SUPABASE_ANON_KEY }}
          TOOLS_SUPABASE_DB_PASSWORD: ${{ secrets.TOOLS_SUPABASE_DB_PASSWORD }}
          TOOLS_SUPABASE_REF: ${{ secrets.TOOLS_SUPABASE_REF }}
          TOOLS_DB_URL: ${{ secrets.TOOLS_DB_URL }}
          TOOLS_CLIPBOARD_PASSWORDS: ${{ secrets.TOOLS_CLIPBOARD_PASSWORDS }}
      - name: Browser smoke test
        if: vars.BROWSER_TESTS == 'on'
        run: |
          npm run build
          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs
        env:
          TOOLS_SUPABASE_URL: ${{ secrets.TOOLS_SUPABASE_URL }}
          TOOLS_SUPABASE_ANON_KEY: ${{ secrets.TOOLS_SUPABASE_ANON_KEY }}
          TOOLS_SUPABASE_DB_PASSWORD: ${{ secrets.TOOLS_SUPABASE_DB_PASSWORD }}
          TOOLS_SUPABASE_REF: ${{ secrets.TOOLS_SUPABASE_REF }}
          TOOLS_DB_URL: ${{ secrets.TOOLS_DB_URL }}
          TOOLS_CLIPBOARD_PASSWORDS: ${{ secrets.TOOLS_CLIPBOARD_PASSWORDS }}
